name: Publish Package

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    publish-npm:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  registry-url: "https://registry.npmjs.org"
            - name: Install dependencies
              run: npm ci --silent
            - name: Build package
              run: npm run build
            - name: Extract package version
              id: package_version
              run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            - name: Create GitHub release
              run: |
                  gh release create "v${{ steps.package_version.outputs.VERSION }}" \
                      --title "v${{ steps.package_version.outputs.VERSION }}" \
                      --generate-notes
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Publish to npm
              run: npm publish --provenance --access public

    publish-mcp:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Install mcp-publisher
              run: |
                  OS=$(uname -s | tr '[:upper:]' '[:lower:]')
                  ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
                  URL="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz"
                  curl -fsSL "$URL" | tar -xz mcp-publisher
                  chmod +x mcp-publisher
            - name: Authenticate via OIDC
              run: ./mcp-publisher login github-oidc
            - name: Validate server configuration
              run: ./mcp-publisher validate server.json
            - name: Publish to MCP Registry
              run: ./mcp-publisher publish
